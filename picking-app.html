<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>カレンダー先行型 + ピッキング実績</title>
<style>
  :root {
    --bg-grad: linear-gradient(165deg, #FFFFFF 0%, #F2F5F7 100%);
    --card: #FFFFFF;
    --card-alt: #F1F4F7;
    --border: rgba(20, 45, 60, 0.13);
    --gold: #E8663F;
    --gold-deep: #C8502E;
    --text: #16262E;
    --subtext: #5C7480;
    --muted: #8496A0;
    --accent: #0C8B7A;
    --accent-ink: #FFFFFF;
    --danger: #C6432A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-grad); background-attachment: fixed; color: var(--text); font-family: -apple-system,"Hiragino Sans",sans-serif; }
  button { border: none; background: none; font-family: inherit; cursor: pointer; color: inherit; }

  .cal-head { padding: 18px 18px 4px; }
  .cal-month-row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .cal-month { font-size: 22px; font-weight: 800; margin: 0; }
  .cal-month-nav {
    width: 30px; height: 30px; border-radius: 999px; background: rgba(20,45,60,0.08);
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--subtext); flex-shrink: 0;
  }
  .cal-search-btn {
    margin-left: auto; width: 32px; height: 32px; border-radius: 999px; background: rgba(20,45,60,0.08);
    display: flex; align-items: center; justify-content: center; color: var(--subtext); flex-shrink: 0;
  }
  .cal-search-btn svg { width: 16px; height: 16px; }
  .cal-today-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: rgba(232,102,63,0.16); border: 1px solid var(--border); color: var(--gold); flex-shrink: 0;
  }

  .day-strip-wrap { position: relative; padding: 0 18px 14px; display: flex; gap: 8px; align-items: flex-start; }
  .day-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; flex: 1; min-width: 0; }
  .day-strip::-webkit-scrollbar { display: none; }
  .tbd-pill {
    flex-shrink: 0; width: 50px; padding: 9px 0 7px; border-radius: 18px; text-align: center;
    background: var(--card); border: 1.5px dashed var(--border); position: relative;
    box-shadow: 0 2px 6px rgba(20,45,60,0.08);
  }
  .tbd-pill .num { color: var(--muted); }
  .month-tbd-pill::after { content: ""; position: absolute; right: -8px; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
  .month-tbd-pill .dow { font-size: 9px; }
  .month-tbd-pill .num { font-size: 15px; color: var(--gold); }
  .day-pill {
    flex-shrink: 0; width: 50px; padding: 9px 0 7px; border-radius: 18px; text-align: center;
    background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(20,45,60,0.08);
  }
  .day-pill .dow { font-size: 10px; color: var(--muted); font-weight: 700; }
  .day-pill .num { font-size: 17px; font-weight: 800; margin-top: 2px; }
  .day-pill.saturday { background: rgba(46,110,196,0.06); border-color: rgba(46,110,196,0.22); }
  .day-pill.saturday .dow, .day-pill.saturday .num { color: #2E6EC4; }
  .day-pill.sunday { background: rgba(198,67,42,0.06); border-color: rgba(198,67,42,0.22); }
  .day-pill.sunday .dow, .day-pill.sunday .num { color: var(--danger); }
  .day-pill.selected { background: var(--gold); color: var(--accent-ink); border-color: var(--gold); }
  .day-pill.selected .dow, .day-pill.selected .num { color: var(--accent-ink); }
  .day-pill .dot-row { display: flex; justify-content: center; align-items: center; gap: 3px; margin-top: 4px; height: 9px; }
  .day-pill .dot { width: 5px; height: 5px; border-radius: 999px; }
  .day-pill:not(.selected) .dot.schedule-dot { background: var(--gold); }
  .day-pill.selected .dot { background: var(--accent-ink); }
  .dot-count-num { font-size: 9px; font-weight: 800; line-height: 1; color: var(--gold); }
  .day-pill.selected .dot-count-num { color: var(--accent-ink); }

  .agenda-label { padding: 4px 18px 10px; font-size: 13px; font-weight: 700; }
  .agenda-label.schedule { color: var(--gold); }
  .agenda-list { padding: 0 16px 40px; display: flex; flex-direction: column; gap: 10px; }

  .agenda-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 13px 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
  .agenda-thumb { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg,var(--gold),var(--gold-deep)); display:flex;align-items:center;justify-content:center; color: var(--accent-ink); flex-shrink: 0; cursor: pointer; overflow: visible; position: relative; }
  .thumb-count-badge {
    position: absolute; bottom: -4px; right: -4px; background: var(--gold); color: #FFFFFF; font-size: 9px; font-weight: 800;
    border-radius: 999px; min-width: 15px; height: 15px; display: flex; align-items: center; justify-content: center;
    padding: 0 3px; border: 1.5px solid #FFFFFF; line-height: 1;
  }
  .agenda-thumb.empty { background: rgba(20,45,60,0.09); color: var(--muted); }
  .agenda-main { flex: 1; min-width: 0; cursor: pointer; }
  .agenda-dest { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .agenda-dest .edit-hint { color: var(--muted); display: flex; flex-shrink: 0; }
  .agenda-dest .edit-hint svg { width: 12px; height: 12px; }
  .agenda-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
  .agenda-check { width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
  .agenda-check.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .agenda-actions-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .notice-bell {
    width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--muted); background: rgba(20,45,60,0.07); border: none; flex-shrink: 0;
  }
  .notice-bell.set { background: rgba(232,102,63,0.18); color: var(--gold); }
  .notice-bell.due { background: rgba(232,102,63,0.22); color: var(--danger); }

  .agenda-empty { text-align: center; padding: 40px 0; color: var(--muted); font-size: 13px; }
  .cal-fab { position: fixed; right: 20px; bottom: 24px; width: 58px; height: 58px; border-radius: 20px; background: var(--gold); color: var(--accent-ink); font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(232,102,63,0.4); z-index: 50; }

  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); z-index: 100;
    background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 10px 18px; border-radius: 999px;
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .add-sheet-overlay {
    position: fixed; inset: 0; background: rgba(5,15,18,0.7); z-index: 150;
    display: none; align-items: flex-end; justify-content: center;
  }
  .add-sheet-overlay.show { display: flex; }
  .add-sheet {
    width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 28px 28px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom,0));
    background: linear-gradient(180deg, #FFFFFF, #F5F8FA);
    border: 2px solid var(--gold); border-bottom: none;
  }
  .add-sheet-title { text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); margin: 0 0 14px; }
  .add-sheet-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .add-sheet-chips button {
    padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 700;
    background: rgba(20,45,60,0.08); border: 1px solid var(--border); color: var(--text);
  }
  .add-sheet-chips button.new-dest-chip { color: var(--gold); border-style: dashed; }
  .add-sheet-new-row-wrap { display: none; margin: -6px 0 16px; }
  .add-sheet-new-row-wrap.show { display: block; }
  .add-sheet-new-row-inner { display: flex; align-items: center; gap: 8px; }
  .add-sheet-new-row-inner input {
    flex: 1; background: var(--card-alt); border: 1px solid var(--border); border-radius: 999px;
    padding: 11px 16px; font-size: 16px; color: var(--text); outline: none; font-family: inherit;
  }
  .add-sheet-new-confirm {
    width: 40px; height: 40px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-weight: 900; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .add-sheet-new-close {
    width: 34px; height: 34px; border-radius: 999px; background: rgba(20,45,60,0.07); color: var(--subtext);
    font-weight: 700; font-size: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .add-sheet-new-hint { font-size: 10px; color: var(--muted); margin: 6px 4px 0; }
  .add-sheet-cancel { width: 100%; padding: 13px; border-radius: 999px; background: rgba(20,45,60,0.07); color: var(--subtext); font-size: 13px; font-weight: 700; margin-top: 4px; margin-bottom: 4px; }

  /* Two-step wizard */
  .step-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .step-dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(20,45,60,0.12); transition: all 0.2s ease; }
  .step-dot.active { background: var(--gold); width: 18px; }
  .step-dot.done { background: var(--accent); }

  .fav-section-label { font-size: 11px; font-weight: 700; color: var(--gold); margin: 0 0 10px; }
  .fav-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .fav-chip {
    flex: 1; padding: 14px 6px; border-radius: 16px; background: rgba(12,139,122,0.12); border: 1.5px solid rgba(12,139,122,0.4);
    color: var(--accent); font-size: 14px; font-weight: 700; text-align: center; font-family: inherit;
  }

  .dest-all-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .dest-edit-toggle { font-size: 11px; font-weight: 700; color: var(--gold); background: none; border: none; font-family: inherit; padding: 4px 2px; }
  .dest-edit-toggle.active { color: var(--danger); }

  .dest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .dest-cell {
    position: relative; padding: 14px 10px; border-radius: 16px; background: var(--card-alt); border: 1.5px solid var(--border);
    font-size: 14px; font-weight: 700; color: var(--text); text-align: left; font-family: inherit;
  }
  .dest-cell.new-cell { border-style: dashed; color: var(--gold); text-align: center; }
  .dest-cell.edit-shake { animation: destShake 0.32s ease; }
  @keyframes destShake {
    0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); }
  }
  .dest-delete-badge {
    position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 999px;
    background: var(--danger); color: #FFFFFF; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; border: 2px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .dest-delete-badge svg { width: 10px; height: 10px; }
  .dest-rule-badge {
    position: absolute; top: -7px; left: -7px; width: 20px; height: 20px; border-radius: 999px;
    background: var(--gold); color: #FFFFFF; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; border: 2px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .dest-rule-overlay {
    position: fixed; inset: 0; background: rgba(5,15,18,0.5); z-index: 296;
    display: none; align-items: flex-end; justify-content: center;
  }
  .dest-rule-overlay.show { display: flex; }
  .dest-rule-sheet {
    width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom,0));
    background: linear-gradient(180deg, #FFFFFF, #F5F8FA); border: 2px solid var(--gold); border-bottom: none; text-align: center;
  }
  .dest-rule-title { font-size: 14px; font-weight: 800; color: var(--text); margin: 0 0 4px; }
  .dest-rule-sub { font-size: 11px; color: var(--subtext); margin: 0 0 14px; }
  .dest-rule-textarea {
    width: 100%; min-height: 90px; background: var(--card-alt); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 14px; font-size: 14px; color: var(--text); outline: none; font-family: inherit; resize: vertical; margin-bottom: 14px;
  }
  .dest-rule-save { width: 100%; padding: 13px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 800; }
  .dest-rule-clear { width: 100%; padding: 11px; border-radius: 999px; background: none; color: var(--danger); font-size: 12px; font-weight: 700; margin-top: 8px; }
  .dest-rule-cancel { width: 100%; padding: 13px; border-radius: 999px; background: rgba(20,45,60,0.07); color: var(--subtext); font-size: 13px; font-weight: 700; margin-top: 8px; }

  .dest-rule-warning-banner {
    display: none; align-items: flex-start; gap: 8px; background: rgba(232,102,63,0.1); border: 1.5px solid rgba(232,102,63,0.4);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 18px; text-align: left;
  }
  .dest-rule-warning-banner.show { display: flex; }
  .dest-rule-warning-banner .icon { flex-shrink: 0; width: 20px; height: 20px; border-radius: 999px; background: var(--gold); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .dest-rule-warning-banner .txt { font-size: 12px; color: var(--text); line-height: 1.5; }

  .dest-delete-confirm-overlay {
    position: fixed; inset: 0; background: rgba(5,15,18,0.5); z-index: 295;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .dest-delete-confirm-overlay.show { display: flex; }
  .dest-delete-confirm-dialog {
    width: 100%; max-width: 300px; border-radius: 22px; padding: 20px; text-align: center;
    background: #FFFFFF; border: 2px solid var(--border); box-shadow: 0 16px 40px rgba(0,0,0,0.25);
  }
  .dest-delete-confirm-title { font-size: 14px; font-weight: 800; color: var(--text); margin: 0 0 6px; }
  .dest-delete-confirm-sub { font-size: 12px; color: var(--subtext); margin: 0 0 16px; }
  .dest-delete-confirm-row { display: flex; gap: 8px; }
  .dest-delete-confirm-row button { flex: 1; padding: 11px; border-radius: 999px; font-size: 13px; font-weight: 700; font-family: inherit; }
  .dest-delete-cancel-btn { background: var(--card-alt); color: var(--subtext); }
  .dest-delete-confirm-btn { background: var(--danger); color: #FFFFFF; }

  .step2-summary {
    display: flex; align-items: center; gap: 10px; background: rgba(12,139,122,0.1); border: 1px solid rgba(12,139,122,0.35);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 20px;
  }
  .step2-summary .check { width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; font-weight: 800; }
  .step2-summary .txt { font-size: 14px; font-weight: 700; }
  .step2-summary .change-btn { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--gold); background: none; border: none; font-family: inherit; }

  .step2-footer { display: flex; gap: 10px; margin-top: 4px; padding-bottom: 4px; }
  .step2-footer button { flex: 1; padding: 14px; border-radius: 999px; font-size: 14px; font-weight: 800; font-family: inherit; }
  .skip-btn { background: rgba(20,45,60,0.07); color: var(--subtext); }
  .finish-btn { background: var(--accent); color: var(--accent-ink); }

  .add-sheet-photo-label { font-size: 11px; font-weight: 700; color: var(--gold); margin: 0 0 8px; text-align: center; }
  .add-sheet-photo-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .photo-src-btn {
    flex: 1; max-width: 150px; padding: 12px 8px; border-radius: 16px; border: 1.5px dashed var(--border);
    background: var(--card-alt); color: var(--subtext); font-size: 12px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .photo-src-btn .ic { display: flex; }
  .photo-src-btn .ic svg { width: 22px; height: 22px; }

  .photo-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px; margin-bottom: 12px; }
  .photo-strip:empty { display: none; margin-bottom: 0; }
  .photo-strip-tile { position: relative; flex-shrink: 0; width: 72px; height: 72px; }
  .photo-strip-tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; border: 1.5px solid var(--border); display: block; }
  .photo-strip-remove {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 999px;
    background: var(--danger); border: 1.5px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px;
  }

  /* Photo lightbox */
  .lightbox-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 285; display: none;
    align-items: center; justify-content: center; flex-direction: column; padding: 20px;
  }
  .lightbox-overlay.show { display: flex; }
  .lightbox-carousel { display: flex; gap: 0; width: 100%; max-width: 420px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .lightbox-carousel::-webkit-scrollbar { display: none; }
  .lightbox-carousel-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; }
  .lightbox-carousel-slide img { max-width: 100%; max-height: 60vh; border-radius: 20px; object-fit: contain; }
  .lightbox-dots { display: flex; gap: 6px; margin-top: 10px; }
  .lightbox-dots span { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.3); }
  .lightbox-dots span.active { background: var(--gold); width: 16px; }
  .lightbox-dest { color: #FFFFFF; font-size: 16px; font-weight: 700; margin-top: 14px; }
  .lightbox-sub { color: rgba(255,255,255,0.65); font-size: 12px; margin-top: 2px; }
  .lightbox-btn-row { display: flex; gap: 10px; margin-top: 20px; width: 100%; max-width: 320px; }
  .lightbox-btn-row button { flex: 1; padding: 13px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .lightbox-edit-btn { background: rgba(232,102,63,0.24); color: #FFB294; border: 1px solid rgba(255,255,255,0.2); }
  .lightbox-close-btn { background: rgba(255,255,255,0.1); color: #FFFFFF; }

  /* Photo edit sheet (for existing tasks) */
  .photo-edit-overlay {
    position: fixed; inset: 0; background: rgba(5,15,18,0.7); z-index: 286;
    display: none; align-items: flex-end; justify-content: center;
  }
  .photo-edit-overlay.show { display: flex; }
  .photo-edit-sheet {
    width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom,0));
    background: linear-gradient(180deg, #FFFFFF, #F5F8FA);
    border: 2px solid var(--gold); border-bottom: none; text-align: center;
  }
  .photo-edit-title { font-size: 13px; font-weight: 700; color: var(--gold); margin: 0 0 14px; }
  .photo-edit-cancel { width: 100%; padding: 13px; border-radius: 999px; background: rgba(20,45,60,0.07); color: var(--subtext); font-size: 13px; font-weight: 700; margin-top: 12px; }

  /* Notice section inside add-sheet */
  .add-sheet-notice-label { font-size: 11px; font-weight: 700; color: var(--gold); margin: 0 0 8px; text-align: center; }
  .add-sheet-notice-box { margin-bottom: 16px; }
  .add-sheet-notice-box input[type="text"] {
    width: 100%; background: var(--card-alt); border: 1px solid var(--border); border-radius: 16px;
    padding: 11px 14px; font-size: 15px; color: var(--text); outline: none; font-family: inherit; margin-bottom: 8px;
  }
  .notice-date-field { position: relative; }
  .notice-date-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--card-alt); border: 1px solid var(--border); border-radius: 16px;
    padding: 11px 14px; font-size: 15px; color: var(--text); font-family: inherit;
  }
  .notice-date-btn.placeholder { color: var(--muted); }
  .notice-date-btn .cal-icon { color: var(--gold); display: flex; flex-shrink: 0; }
  .notice-date-btn .cal-icon svg { width: 19px; height: 19px; }

  /* Mini calendar popover */
  .mini-cal-popover {
    display: none; position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px);
    background: #FFFFFF; border: 1.5px solid var(--border); border-radius: 18px; padding: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
  }
  .mini-cal-popover.show { display: block; }
  .mini-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

    <button class="notice-alert-dismiss" id="notice-alert-dismiss">確認しました</button>

<script>
  const REAL_TODAY = "2026-08-07"; // 実際の「今日」(完了記録はここに刻まれる)
  const REAL_NOW_HHMM = "14:32";
  const dow = ["日","月","火","水","木","金","土"];

  const tasks = [
    { id: 1, dest: "赤のれん", shipDate: "2026-08-07", delivery: null, photos: [], done: false, completedAt: null, noticeText: "分納の連絡が来たら確認", noticeDate: "2026-08-07", noticeNotified: false },
    { id: 2, dest: "ユニー", shipDate: "2026-08-07", delivery: "2026-08-12", photos: [], done: false, completedAt: null, noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 3, dest: "スポット", shipDate: "2026-08-09", delivery: null, photos: [], done: false, completedAt: null, noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 4, dest: "ダイエー", shipDate: "2026-08-05", delivery: null, photos: [], done: true, completedAt: "2026-08-06T16:42:00", noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 5, dest: "赤のれん", shipDate: "2026-08-03", delivery: null, photos: [], done: true, completedAt: "2026-08-03T10:15:00", noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 6, dest: "ユニー", shipDate: "2026-08-06", delivery: null, photos: [], done: true, completedAt: "2026-08-06T09:05:00", noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 7, dest: "スポット", shipDate: null, delivery: null, photos: [], done: false, completedAt: null, noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 8, dest: "ユニー", shipDate: "2026-09-15", delivery: null, photos: [], done: false, completedAt: null, noticeText: "入荷予定を確認してから登録", noticeDate: "2026-09-10", noticeNotified: false },
    { id: 9, dest: "サンキ", shipDate: "2026-08", delivery: null, photos: [], done: false, completedAt: null, noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 10, dest: "イトゴ", shipDate: "2026-08-07", delivery: null, photos: [], done: false, completedAt: null, noticeText: "", noticeDate: null, noticeNotified: false },
    { id: 11, dest: "ヨシヅヤ", shipDate: "2026-08-07", delivery: null, photos: [], done: false, completedAt: null, noticeText: "", noticeDate: null, noticeNotified: false },
  ];

  const TBD = "TBD";
  const MTBD = "MTBD";
  let selectedDay = REAL_TODAY;
  let anchorMonth = REAL_TODAY.slice(0,7); // 'YYYY-MM'

  function isMonthOnly(shipDate) { return !!shipDate && shipDate.length === 7; }
  function monthOnlyLabel(shipDate) {
    const [, m] = shipDate.split("-").map(Number);
    return `${m}月中(日未定)`;
  }
  function shipDateShortLabel(shipDate) {
    if (!shipDate) return "出荷日未定";
    if (isMonthOnly(shipDate)) return monthOnlyLabel(shipDate);
    return fmtShort(shipDate) + "出荷";
  }

  function renderDotIndicator(count) {
    if (count <= 0) return "";
    if (count > 3) return `<span class="dot-count-num">${count}</span>`;
    return Array.from({length: count}).map(() => '<span class="dot schedule-dot"></span>').join("");
  }

  function fmtShort(iso) {
    const d = new Date(iso + "T00:00:00");
    return `${d.getMonth()+1}/${d.getDate()}(${dow[d.getDay()]})`;
  }
  function fmtHHMM(isoDateTime) {
    const t = isoDateTime.split("T")[1] || "";
    return t.slice(0,5);
  }
  function dateOf(isoDateTime) { return isoDateTime.slice(0,10); }
  const ICON_CAMERA_SM = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.4"/></svg>';
  const ICON_IMAGE_SM = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>';
  function photoThumbInner(photos) {
    if (photos && photos.length > 0) {
      const badge = photos.length > 1 ? `<span class="thumb-count-badge">${photos.length}</span>` : "";
      return `<img src="${photos[0]}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">${badge}`;
    }
    return ICON_IMAGE_SM;
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function renderMonthHeader() {
    const [y, m] = anchorMonth.split("-").map(Number);
    const label = document.getElementById("cal-month");
    const isCurrentYear = y === Number(REAL_TODAY.slice(0,4));
    label.textContent = isCurrentYear ? `${m}月` : `${y}年${m}月`;
  }

  function shiftAnchorMonth(delta) {
    const wasMonthTbd = selectedDay === MTBD;
    const [y, m] = anchorMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    anchorMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    // pick a sensible default selection within the new month
    if (wasMonthTbd) {
      selectedDay = MTBD;
    } else if (anchorMonth === REAL_TODAY.slice(0,7)) {
      selectedDay = REAL_TODAY;
    } else {
      selectedDay = `${anchorMonth}-01`;
    }
    renderAll();
  }

  function jumpToToday() {
    anchorMonth = REAL_TODAY.slice(0,7);
    selectedDay = REAL_TODAY;
    renderAll();
  }

  document.getElementById("month-prev").addEventListener("click", () => shiftAnchorMonth(-1));
  document.getElementById("month-next").addEventListener("click", () => shiftAnchorMonth(1));
  document.getElementById("today-btn").addEventListener("click", jumpToToday);

  function renderTbdPill() {
    const pill = document.getElementById("tbd-pill");
    const dotRow = document.getElementById("tbd-dot-row");
    const count = tasks.filter((t) => !t.shipDate).length;
    dotRow.innerHTML = renderDotIndicator(count);
    pill.classList.toggle("selected", selectedDay === TBD);
  }

  function renderMonthTbdPill() {
    const pill = document.getElementById("month-tbd-pill");
    const dotRow = document.getElementById("month-tbd-dot-row");
    const [, m] = anchorMonth.split("-").map(Number);
    document.getElementById("month-tbd-pill-num").textContent = m;
    const count = tasks.filter((t) => t.shipDate === anchorMonth).length;
    dotRow.innerHTML = renderDotIndicator(count);
    pill.classList.toggle("selected", selectedDay === MTBD);
  }

  function renderDayStrip() {
    renderMonthHeader();
    renderTbdPill();
    renderMonthTbdPill();
    const strip = document.getElementById("day-strip");
    const [y, m] = anchorMonth.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const days = [];
    for (let day = 1; day <= daysInMonth; day++) {
      days.push(`${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`);
    }
    strip.innerHTML = days.map((iso) => {
      const d = new Date(iso + "T00:00:00");
      const count = tasks.filter((t) => t.shipDate === iso).length;
      const isSel = iso === selectedDay;
      const dowIdx = d.getDay();
      const weekendClass = dowIdx === 0 ? "sunday" : dowIdx === 6 ? "saturday" : "";
      return `<button class="day-pill ${weekendClass} ${isSel ? "selected" : ""}" data-day="${iso}">
        <div class="dow">${dow[dowIdx]}</div>
        <div class="num">${d.getDate()}</div>
        <div class="dot-row">${renderDotIndicator(count)}</div>
      </button>`;
    }).join("");
    strip.querySelectorAll(".day-pill").forEach((b) => b.addEventListener("click", () => {
      selectedDay = b.dataset.day;
      renderAll();
    }));
    requestAnimationFrame(() => {
      const sel = strip.querySelector(".day-pill.selected");
      if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
    });
  }
  document.getElementById("tbd-pill").addEventListener("click", () => {
    selectedDay = TBD;
    renderAll();
  });
  document.getElementById("month-tbd-pill").addEventListener("click", () => {
    selectedDay = MTBD;
    renderAll();
  });

  function renderScheduleAgenda() {
    const label = document.getElementById("agenda-label");
    const list = document.getElementById("agenda-list");
    label.className = "agenda-label schedule";
    let items;
    if (selectedDay === TBD) {
      label.textContent = "出荷日未定の案件";
      items = tasks.filter((t) => !t.shipDate);
    } else if (selectedDay === MTBD) {
      const [, m] = anchorMonth.split("-").map(Number);
      label.textContent = `${m}月中の出荷予定(日未定)`;
      items = tasks.filter((t) => t.shipDate === anchorMonth);
    } else {
      const d = new Date(selectedDay + "T00:00:00");
      label.textContent = `${d.getMonth()+1}月${d.getDate()}日(${dow[d.getDay()]})の出荷予定`;
      items = tasks.filter((t) => t.shipDate === selectedDay);
    }
    if (items.length === 0) {
      const emptyText = selectedDay === TBD ? "出荷日未定の案件はありません"
        : selectedDay === MTBD ? "この月中に日未定の案件はありません"
        : "この日の予定はありません";
      list.innerHTML = `<div class="agenda-empty">${emptyText}</div>`;
      return;
    }
    list.innerHTML = items.map((t) => `
      <div class="agenda-card">
        <div class="agenda-thumb ${t.photos && t.photos.length ? "" : "empty"}" data-photo-task-id="${t.id}">${photoThumbInner(t.photos)}</div>
        <div class="agenda-main" data-edit-task-id="${t.id}">
          <div class="agenda-dest">${t.dest}<span class="edit-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></div>
          <div class="agenda-sub">${
            t.done && t.completedAt
              ? `完了済み ・ ${fmtShort(dateOf(t.completedAt))} ${fmtHHMM(t.completedAt)}`
              : (t.delivery ? "納品 " + fmtShort(t.delivery) : "納品日未設定")
          }</div>
        </div>
        <div class="agenda-actions-col">
          <button class="agenda-check ${t.done ? "done" : ""}" data-id="${t.id}">${t.done ? "✓" : ""}</button>
          <button class="notice-bell ${t.noticeDate ? (t.noticeDate <= REAL_TODAY ? "due" : "set") : ""}" data-notice-task-id="${t.id}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        </div>
      </div>`).join("");
    list.querySelectorAll(".agenda-main").forEach((el) => el.addEventListener("click", () => {
      openTaskEditSheet(Number(el.dataset.editTaskId));
    }));
    list.querySelectorAll(".agenda-check").forEach((b) => b.addEventListener("click", () => {
      const t = tasks.find((x) => x.id === Number(b.dataset.id));
      if (!t.done) {
        t.done = true;
        t.completedAt = `${REAL_TODAY}T${REAL_NOW_HHMM}:00`;
        showToast(`完了時刻を記録しました ${REAL_NOW_HHMM}`);
      } else {
        t.done = false;
        t.completedAt = null;
      }
      renderAll();
    }));
    list.querySelectorAll(".notice-bell").forEach((b) => b.addEventListener("click", () => {
      openNoticeEditSheet(Number(b.dataset.noticeTaskId));
    }));
    list.querySelectorAll(".agenda-thumb").forEach((el) => el.addEventListener("click", () => {
      openPhotoForTask(Number(el.dataset.photoTaskId));
    }));
  }

  function renderAll() {
    renderDayStrip();
    renderScheduleAgenda();
    saveState();
  }

  const destOptions = ["赤のれん", "ユニー", "スポット", "ダイエー", "サンキ", "北関東サンキ", "イトゴ", "ヨシヅヤ", "アピタ"];
  let pendingPhotos = [];

  function renderPhotoStrip(photos, stripId, onRemove) {
    const strip = document.getElementById(stripId);
    strip.innerHTML = photos.map((src, i) => `
      <div class="photo-strip-tile">
        <img src="${src}">
        <button type="button" class="photo-strip-remove" data-idx="${i}">✕</button>
      </div>`).join("");
    strip.querySelectorAll(".photo-strip-remove").forEach((b) => b.addEventListener("click", () => {
      onRemove(Number(b.dataset.idx));
    }));
  }

  function renderAddPhotoStrip() {
    renderPhotoStrip(pendingPhotos, "add-sheet-photo-strip", (idx) => {
      pendingPhotos.splice(idx, 1);
      renderAddPhotoStrip();
    });
  }

  function resetPhotoPicker() {
    pendingPhotos = [];
    document.getElementById("photo-camera-input").value = "";
    document.getElementById("photo-library-input").value = "";
    renderAddPhotoStrip();
  }
  function addPendingPhotoFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      pendingPhotos.push(e.target.result);
      renderAddPhotoStrip();
    };
    reader.readAsDataURL(file);
  }
  function handlePhotoFiles(fileList) {
    Array.from(fileList || []).forEach((file) => addPendingPhotoFile(file));
  }
  document.getElementById("photo-camera-btn").addEventListener("click", () => document.getElementById("photo-camera-input").click());
  document.getElementById("photo-library-btn").addEventListener("click", () => document.getElementById("photo-library-input").click());
  document.getElementById("photo-camera-input").addEventListener("change", (e) => { handlePhotoFiles(e.target.files); e.target.value = ""; });
  document.getElementById("photo-library-input").addEventListener("change", (e) => { handlePhotoFiles(e.target.files); e.target.value = ""; });

  let addSheetSelectedDest = null;
  const destUsageCount = {};
  tasks.forEach((t) => { destUsageCount[t.dest] = (destUsageCount[t.dest] || 0) + 1; });

  function finalizeTask(discardOptional) {
    const noticeText = discardOptional ? "" : document.getElementById("add-notice-text").value.trim();
    const noticeDate = discardOptional ? null : addNoticeDate;
    const photos = discardOptional ? [] : [...pendingPhotos];
    tasks.push({
      id: Date.now(), dest: addSheetSelectedDest,
      shipDate: selectedDay === TBD ? null : selectedDay === MTBD ? anchorMonth : selectedDay,
      delivery: null, photos: photos, done: false, completedAt: null,
      noticeText: noticeDate ? noticeText : "", noticeDate: noticeDate, noticeNotified: false,
    });
    destUsageCount[addSheetSelectedDest] = (destUsageCount[addSheetSelectedDest] || 0) + 1;
    closeAddSheet();
    showToast(`${addSheetSelectedDest} を追加しました${photos.length ? `(写真${photos.length}枚)` : ""}`);
    renderAll();
  }

  function updateStepDots(step) {
    document.getElementById("step-dot-1").classList.toggle("active", step === 1);
    document.getElementById("step-dot-1").classList.toggle("done", step === 2);
    document.getElementById("step-dot-2").classList.toggle("active", step === 2);
  }

  function goToStep1() {
    document.getElementById("add-step-1").style.display = "block";
    document.getElementById("add-step-2").style.display = "none";
    updateStepDots(1);
    closeMiniCal();
  }

  function goToStep2(destName) {
    addSheetSelectedDest = destName;
    document.getElementById("step2-dest-label").textContent = destName;
    document.getElementById("add-step-1").style.display = "none";
    document.getElementById("add-step-2").style.display = "block";
    updateStepDots(2);
    const banner = document.getElementById("step2-rule-banner");
    if (destRules[destName]) {
      document.getElementById("step2-rule-text").textContent = destRules[destName];
      banner.classList.add("show");
    } else {
      banner.classList.remove("show");
    }
  }

  let destEditMode = false;
  let pendingDeleteDest = null;
  const destRules = {
    "赤のれん": "伝票不要。ケース数を書いた紙を会計に渡すこと。",
  };

  function renderDestList(keepNewRowOpen) {
    const grid = document.getElementById("add-sheet-chips");
    const favRow = document.getElementById("fav-row");
    const favLabel = document.getElementById("fav-label");
    const newRow = document.getElementById("add-sheet-new-row");
    if (!keepNewRowOpen) newRow.classList.remove("show");

    const favs = [...destOptions]
      .filter((d) => destUsageCount[d] > 0)
      .sort((a, b) => (destUsageCount[b] || 0) - (destUsageCount[a] || 0))
      .slice(0, 3);

  // ---------- Mini calendar date picker for notice dates + task ship date ----------
  let addNoticeDate = null;

  let miniCalOpenTarget = null; // 'add' | 'edit' | 'taskShip' | null
  const miniCalView = {
    add: { year: Number(REAL_TODAY.slice(0,4)), month: Number(REAL_TODAY.slice(5,7)) },
    edit: { year: Number(REAL_TODAY.slice(0,4)), month: Number(REAL_TODAY.slice(5,7)) },
    taskShip: { year: Number(REAL_TODAY.slice(0,4)), month: Number(REAL_TODAY.slice(5,7)) },
  };
  function getMiniCalValue(target) {
    if (target === "add") return addNoticeDate;
    if (target === "taskShip") return editTaskShipDate;
    return editNoticeDateValue;
  }
  function setMiniCalValueVar(target, dateStr) {
    if (target === "add") addNoticeDate = dateStr;
    else if (target === "taskShip") editTaskShipDate = dateStr;
    else editNoticeDateValue = dateStr;
  }

  function setNoticeDateValue(target, dateStr) {
    setMiniCalValueVar(target, dateStr);
    const btn = document.getElementById(`${target}-notice-date-btn`);
    const label = document.getElementById(`${target}-notice-date-label`);
    if (dateStr) {
      label.textContent = isMonthOnly(dateStr) ? monthOnlyLabel(dateStr) : fmtShort(dateStr);
      btn.classList.remove("placeholder");

      label.textContent = target === "taskShip" ? "出荷日未定" : "日付を選択";
      btn.classList.add("placeholder");

  }

  function closeMiniCal() {
    if (miniCalOpenTarget) {
      const el = document.getElementById(`${miniCalOpenTarget}-notice-cal-popover`);
      if (el) el.classList.remove("show");
    }
    miniCalOpenTarget = null;
  }

  function openMiniCal(target) {
    if (miniCalOpenTarget === target) { closeMiniCal(); return; }
    closeMiniCal();
    miniCalOpenTarget = target;
    const current = getMiniCalValue(target);
    miniCalView[target] = current
      ? { year: Number(current.slice(0,4)), month: Number(current.slice(5,7)) }
      : { year: Number(REAL_TODAY.slice(0,4)), month: Number(REAL_TODAY.slice(5,7)) };
    renderMiniCal(target);
    document.getElementById(`${target}-notice-cal-popover`).classList.add("show");
  }

  function renderMiniCal(target) {
    const popover = document.getElementById(`${target}-notice-cal-popover`);
    const { year, month } = miniCalView[target];
    const selected = getMiniCalValue(target);
    const firstDow = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<div class="mini-cal-day empty"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const isToday = dateStr === REAL_TODAY;
      const isSelected = dateStr === selected;
      const cellDow = new Date(year, month - 1, day).getDay();
      const weekendClass = cellDow === 0 ? "sunday" : cellDow === 6 ? "saturday" : "";
      cells += `<button type="button" class="mini-cal-day ${weekendClass} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" data-date="${dateStr}">${day}</button>`;
    }
    const clearLabel = target === "taskShip" ? "未定にする" : "クリア";
    const monthOnlyValue = `${year}-${String(month).padStart(2,"0")}`;
    const monthOnlyBtn = target === "taskShip"
      ? `<button type="button" class="month-only-quick" data-quick="monthonly">${month}月未定にする</button>`
      : "";
    popover.innerHTML = `
      <div class="mini-cal-head">
        <button type="button" data-nav="-1">‹</button>
        <span>${year}年${month}月</span>
        <button type="button" data-nav="1">›</button>
      </div>
      <div class="mini-cal-grid">
        ${dow.map((d, i) => `<div class="mini-cal-dow ${i === 0 ? "sunday" : i === 6 ? "saturday" : ""}">${d}</div>`).join("")}
        ${cells}
      </div>
      ${monthOnlyBtn}
      <div class="mini-cal-footer">
        <button type="button" class="today-quick" data-quick="today">今日</button>
        <button type="button" class="clear-quick" data-quick="clear">${clearLabel}</button>
      </div>`;
    popover.querySelectorAll(".mini-cal-day:not(.empty)").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation();
      setNoticeDateValue(target, el.dataset.date);
      closeMiniCal();
    }));
    popover.querySelector('[data-nav="-1"]').addEventListener("click", (e) => {
      e.stopPropagation();
      const d = new Date(miniCalView[target].year, miniCalView[target].month - 2, 1);
      miniCalView[target] = { year: d.getFullYear(), month: d.getMonth() + 1 };
      renderMiniCal(target);
    });
    popover.querySelector('[data-nav="1"]').addEventListener("click", (e) => {
      e.stopPropagation();
      const d = new Date(miniCalView[target].year, miniCalView[target].month, 1);
      miniCalView[target] = { year: d.getFullYear(), month: d.getMonth() + 1 };
      renderMiniCal(target);
    });
    popover.querySelector('[data-quick="today"]').addEventListener("click", (e) => {
      e.stopPropagation();
      setNoticeDateValue(target, REAL_TODAY);
      closeMiniCal();
    });
    popover.querySelector('[data-quick="clear"]').addEventListener("click", (e) => {
      e.stopPropagation();
      setNoticeDateValue(target, null);
      closeMiniCal();
    });
    const monthOnlyEl = popover.querySelector('[data-quick="monthonly"]');
    if (monthOnlyEl) monthOnlyEl.addEventListener("click", (e) => {
      e.stopPropagation();
      setNoticeDateValue(target, monthOnlyValue);
      closeMiniCal();
    });
  }

  document.getElementById("task-edit-save").addEventListener("click", () => {
    const t = tasks.find((x) => x.id === editingTaskId);
    if (!t) return;
    const oldDest = t.dest;
    const oldShipDate = t.shipDate;
    t.dest = editTaskDestValue;
    t.shipDate = editTaskShipDate;
    if (t.dest !== oldDest) {
      destUsageCount[oldDest] = Math.max(0, (destUsageCount[oldDest] || 1) - 1);
      destUsageCount[t.dest] = (destUsageCount[t.dest] || 0) + 1;
    }
    closeTaskEditSheet(false);
    showToast("案件を更新しました");
    // jump the calendar to wherever this task now lives, so the change is visible
    if (t.shipDate && isMonthOnly(t.shipDate)) {
      anchorMonth = t.shipDate;
      selectedDay = MTBD;
    } else if (t.shipDate) {
      selectedDay = t.shipDate;
      anchorMonth = t.shipDate.slice(0,7);
    } else {
      selectedDay = TBD;
    }
    renderAll();
  });
  document.getElementById("task-edit-delete").addEventListener("click", () => {
    const t = tasks.find((x) => x.id === editingTaskId);
    if (!t) return;
    openTaskDeleteConfirm(t.id, t.dest);
  });
  document.getElementById("task-edit-cancel").addEventListener("click", () => closeTaskEditSheet(false));
  document.getElementById("task-edit-overlay").addEventListener("click", (e) => {
    if (e.target.id === "task-edit-overlay") closeTaskEditSheet(false);
  });

  // ---------- Search sheet ----------
  let searchQuery = "";
  let searchMonthMode = "all"; // 'all' | 'pick' | 'tbd'
  let searchMonth = REAL_TODAY.slice(0,7); // 'YYYY-MM'
  let searchMonthGridYear = Number(REAL_TODAY.slice(0,4));
  let searchMonthGridOpen = false;

  function statusBadge(t) {
    if (t.done) {
      return `<span class="search-result-badge done">完了</span>`;
    }
    return `<span class="search-result-badge doing">進行中</span>`;
  }

  function getSearchResults() {
    const q = searchQuery.trim();
    return tasks
      .filter((t) => !q || t.dest.includes(q))
      .filter((t) => {
        if (searchMonthMode === "tbd") return !t.shipDate;
        if (searchMonthMode === "pick") return t.shipDate && t.shipDate.slice(0,7) === searchMonth;
        return true; // 'all'
      })
      .sort((a, b) => {
        const av = a.shipDate || "9999-99-99";
        const bv = b.shipDate || "9999-99-99";
        return av.localeCompare(bv);
      });
  }

  function renderSearchMonthLabel() {
    const [y, m] = searchMonth.split("-").map(Number);
    const isCurrentYear = y === Number(REAL_TODAY.slice(0,4));
    document.getElementById("search-month-label").textContent = isCurrentYear ? `${m}月` : `${y}年${m}月`;
  }

  function closeSearchMonthGrid() {
    searchMonthGridOpen = false;
    document.getElementById("search-month-grid-popover").classList.remove("show");
  }

  function renderSearchMonthGrid() {
    const popover = document.getElementById("search-month-grid-popover");
    const [selY, selM] = searchMonth.split("-").map(Number);
    const cells = Array.from({length: 12}, (_, i) => i + 1).map((m) => {
      const isCurrent = searchMonthGridYear === Number(REAL_TODAY.slice(0,4)) && m === Number(REAL_TODAY.slice(5,7));
      const isSelected = searchMonthGridYear === selY && m === selM;
      return `<button type="button" class="search-month-grid-cell ${isCurrent ? "current" : ""} ${isSelected ? "selected" : ""}" data-month="${m}">${m}月</button>`;
    }).join("");
    popover.innerHTML = `
      <div class="search-month-grid-head">
        <button type="button" data-yearnav="-1">‹</button>
        <span>${searchMonthGridYear}年</span>
        <button type="button" data-yearnav="1">›</button>
      </div>
      <div class="search-month-grid">${cells}</div>`;
    popover.querySelector('[data-yearnav="-1"]').addEventListener("click", (e) => {
      e.stopPropagation();
      searchMonthGridYear--;
      renderSearchMonthGrid();
    });
    popover.querySelector('[data-yearnav="1"]').addEventListener("click", (e) => {
      e.stopPropagation();
      searchMonthGridYear++;
      renderSearchMonthGrid();
    });
    popover.querySelectorAll(".search-month-grid-cell").forEach((c) => c.addEventListener("click", (e) => {
      e.stopPropagation();
      searchMonth = `${searchMonthGridYear}-${String(c.dataset.month).padStart(2,"0")}`;
      renderSearchMonthLabel();
      closeSearchMonthGrid();
      renderSearchResults();
    }));
  }

  document.getElementById("search-month-picker-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    searchMonthGridOpen = !searchMonthGridOpen;
    if (searchMonthGridOpen) {
      searchMonthGridYear = Number(searchMonth.slice(0,4));
      renderSearchMonthGrid();
      document.getElementById("search-month-grid-popover").classList.add("show");
    } else {
      closeSearchMonthGrid();
    }
  });

  function renderSearchResults() {
    const results = getSearchResults();
    const label = document.getElementById("search-results-label");
    const list = document.getElementById("search-results");
    label.textContent = `${results.length}件`;
    if (results.length === 0) {
      list.innerHTML = `<div class="search-no-results">該当する案件がありません</div>`;
      return;
    }
    list.innerHTML = results.map((t) => `
      <div class="search-result-card" data-id="${t.id}">
        <button type="button" class="search-result-thumb ${t.photos && t.photos.length ? "" : "empty"}" data-task-id="${t.id}">${photoThumbInner(t.photos)}</button>
        <div class="search-result-main">
          <div class="search-result-dest">${t.dest}</div>
          <div class="search-result-sub">${
            shipDateShortLabel(t.shipDate)
          }${t.done && t.completedAt ? ` ・ 完了 ${fmtShort(dateOf(t.completedAt))} ${fmtHHMM(t.completedAt)}` : ""}</div>
        </div>
        ${statusBadge(t)}
      </div>`).join("");
    list.querySelectorAll(".search-result-thumb").forEach((el) => el.addEventListener("click", (e) => {
      const t = tasks.find((x) => x.id === Number(el.dataset.taskId));
      if (t && hasPhotos(t.photos)) {
        e.stopPropagation();
        openLightbox(t);
      }
    }));
    list.querySelectorAll(".search-result-card").forEach((b) => b.addEventListener("click", () => {
      const t = tasks.find((x) => x.id === Number(b.dataset.id));
      if (!t) return;
      closeSearchSheet();
      if (t.shipDate && isMonthOnly(t.shipDate)) {
        anchorMonth = t.shipDate;
        selectedDay = MTBD;
      } else if (t.shipDate) {
        selectedDay = t.shipDate;
        anchorMonth = t.shipDate.slice(0,7);
      } else {
        selectedDay = TBD;
      }
      renderAll();
    }));
  }

  function setSearchMonthMode(newMode) {
    searchMonthMode = newMode;
    document.getElementById("search-month-all").classList.toggle("active", newMode === "all");
    document.getElementById("search-month-pick").classList.toggle("active", newMode === "pick");
    document.getElementById("search-month-tbd").classList.toggle("active", newMode === "tbd");
    document.getElementById("search-month-field").classList.toggle("show", newMode === "pick");
    if (newMode !== "pick") closeSearchMonthGrid();
    renderSearchResults();
  }

  // ---- Destination suggestions ----
  function renderSuggestDropdown() {
    const dropdown = document.getElementById("search-suggest-dropdown");
    const q = searchQuery.trim();
    if (!q) {
      dropdown.classList.remove("show");
      return;
    }
    const matches = destOptions.filter((d) => d.includes(q) && d !== q).slice(0, 6);
    if (matches.length === 0) {
      dropdown.classList.remove("show");
      return;
    }
    dropdown.innerHTML = matches.map((name) => {
      const idx = name.indexOf(q);
      const marked = idx >= 0
        ? `${escapeText(name.slice(0, idx))}<mark>${escapeText(name.slice(idx, idx + q.length))}</mark>${escapeText(name.slice(idx + q.length))}`
        : escapeText(name);
      return `<button type="button" class="search-suggest-item" data-name="${name}">${marked}</button>`;
    }).join("");
    dropdown.querySelectorAll(".search-suggest-item").forEach((b) => b.addEventListener("click", () => {
      searchQuery = b.dataset.name;
      document.getElementById("search-text-input").value = searchQuery;
      document.getElementById("search-text-clear").style.display = "flex";
      dropdown.classList.remove("show");
      renderSearchResults();
    }));
    dropdown.classList.add("show");
  }

  function openSearchSheet() {
    searchQuery = "";
    searchMonth = REAL_TODAY.slice(0,7);
    document.getElementById("search-text-input").value = "";
    document.getElementById("search-text-clear").style.display = "none";
    document.getElementById("search-suggest-dropdown").classList.remove("show");
    closeSearchMonthGrid();
    setSearchMonthMode("all");
    renderSearchMonthLabel();
    renderSearchResults();
    document.getElementById("search-sheet-overlay").classList.add("show");
    document.querySelector(".search-sheet").scrollTop = 0;
  }
  function closeSearchSheet() {
    document.getElementById("search-sheet-overlay").classList.remove("show");
    closeSearchMonthGrid();
  }
  document.getElementById("search-open-btn").addEventListener("click", openSearchSheet);
  document.getElementById("search-sheet-close").addEventListener("click", closeSearchSheet);
  document.getElementById("search-sheet-overlay").addEventListener("click", (e) => {
    if (e.target.id === "search-sheet-overlay") closeSearchSheet();
  });
  document.getElementById("search-text-input").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    document.getElementById("search-text-clear").style.display = searchQuery ? "flex" : "none";
    renderSuggestDropdown();
    renderSearchResults();
  });
  document.getElementById("search-text-clear").addEventListener("click", () => {
    searchQuery = "";
    document.getElementById("search-text-input").value = "";
    document.getElementById("search-text-clear").style.display = "none";
    document.getElementById("search-suggest-dropdown").classList.remove("show");
    renderSearchResults();
  });
  document.getElementById("search-month-all").addEventListener("click", () => setSearchMonthMode("all"));
  document.getElementById("search-month-pick").addEventListener("click", () => {
    setSearchMonthMode("pick");
    renderSearchMonthLabel();
  });
  document.getElementById("search-month-tbd").addEventListener("click", () => setSearchMonthMode("tbd"));
  document.addEventListener("click", (e) => {
    if (searchMonthGridOpen && !e.target.closest(".search-month-field")) closeSearchMonthGrid();
    if (!e.target.closest(".search-input-wrap")) document.getElementById("search-suggest-dropdown").classList.remove("show");
  });

  // ---------- Startup notice alert popup ----------
  function checkNoticeAlerts() {
    const due = tasks.filter((t) => t.noticeDate && t.noticeDate <= REAL_TODAY && !t.noticeNotified);
    if (due.length === 0) return;
    const itemsEl = document.getElementById("notice-alert-items");
    itemsEl.innerHTML = due.map((t) => `
      <div class="notice-alert-item">
        <div class="dest">${t.dest}</div>
        <div class="msg">${t.noticeText ? escapeText(t.noticeText) : "お知らせ"}</div>
      </div>`).join("");
    document.getElementById("notice-alert-overlay").classList.add("show");
    document.getElementById("notice-alert-dismiss").onclick = () => {
      due.forEach((t) => { t.noticeNotified = true; });
      document.getElementById("notice-alert-overlay").classList.remove("show");
      renderAll();
    };
  }
  function escapeText(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- localStorage persistence ----------
  const STORAGE_KEY = "shippingCalendarMockup_v1";

  function saveState() {
    try {
      const payload = JSON.stringify({ tasks, destOptions, destUsageCount, destRules });
      localStorage.setItem(STORAGE_KEY, payload);
    } catch (err) {
      console.warn("saveState failed:", err);
      showToast("保存に失敗しました(写真が多すぎる可能性があります)");
    }
  }

  function loadState() {
    let raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return;
    }
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (Array.isArray(data.tasks)) {
        tasks.length = 0;
        data.tasks.forEach((t) => tasks.push(t));
      }
      if (Array.isArray(data.destOptions)) {
        destOptions.length = 0;
        data.destOptions.forEach((d) => destOptions.push(d));
      }
      if (data.destUsageCount && typeof data.destUsageCount === "object") {
        Object.keys(destUsageCount).forEach((k) => delete destUsageCount[k]);
        Object.assign(destUsageCount, data.destUsageCount);
      }
      if (data.destRules && typeof data.destRules === "object") {
        Object.keys(destRules).forEach((k) => delete destRules[k]);
        Object.assign(destRules, data.destRules);
      }
    } catch (err) {
      console.warn("loadState parse failed:", err);
    }
  }

  loadState();
  renderAll();
  checkNoticeAlerts();
</script>
</body>
</html>
