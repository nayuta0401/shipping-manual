<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ピッキング進捗ボード</title>
<style>
  :root {
    --bg-grad: linear-gradient(165deg, #2A6B72 0%, #1D4E58 45%, #123138 100%);
    --card: rgba(38, 78, 74, 0.82);
    --card-alt: rgba(18, 42, 39, 0.65);
    --border: rgba(224, 179, 85, 0.45);
    --gold: #E0B355;
    --gold-deep: #B8863A;
    --text: #F1EDE0;
    --subtext: #B9D3CD;
    --muted: #7FA39D;
    --accent: #6FE0C8;
    --accent-ink: #123138;
    --green: #8FC97A;
    --dark-green: #16321E;
    --dark-accent: #123138;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    height: 100%;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  /* Header */
  .header { padding: 20px 16px 12px; }
  .header-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .header-bar { width: 6px; height: 20px; background: var(--gold); border-radius: 2px; box-shadow: 0 0 8px rgba(224,179,85,0.6); }
  .header-title { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; margin: 0; text-shadow: 0 0 14px rgba(111,224,200,0.35); }
  .header-sub { font-size: 12px; color: var(--subtext); padding-left: 14px; margin: 0; }

  /* Nav switcher */
  .nav-switch { display: flex; gap: 6px; padding: 0 16px 12px; }
  .nav-btn {
    flex: 1; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border);
    font-size: 13px; font-weight: 700; background: var(--card); color: var(--subtext);
  }
  .nav-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 0 10px rgba(111,224,200,0.5); }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* Form card */
  .form-card { margin: 0 16px 16px; background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.25); }

  /* Quest-log style entry form */
  .quest-form { padding: 4px 16px 20px; }
  .quest-node { position: relative; padding-left: 30px; padding-bottom: 24px; }
  .quest-node::before {
    content: ""; position: absolute; left: 8px; top: 20px; bottom: 0; width: 1px;
    background: rgba(224,179,85,0.3);
  }
  .quest-node.no-line::before { display: none; }
  .quest-node.no-line { padding-bottom: 0; }
  .quest-node-badge {
    position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--gold);
    background: var(--gold); box-shadow: 0 0 6px rgba(224,179,85,0.5); font-size: 8px; color: #123138;
    animation: crownPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .quest-node-badge.empty { background: rgba(0,0,0,0.3); border-color: rgba(224,179,85,0.5); }
  .quest-label { font-size: 11px; font-weight: 700; color: var(--gold); margin: 0 0 8px; }
  .quest-form .field-row { gap: 22px; margin-top: 0; }
  .quest-form .field { margin-top: 0; }
  .quest-form .select-btn {
    background: none; border: none; border-bottom: 1px solid rgba(224,179,85,0.4); border-radius: 0;
    padding: 0 0 7px; font-size: 15px; font-weight: 600;
  }
  .quest-form .select-btn.placeholder { font-weight: 400; }
  .quest-form input[type="text"], .quest-form input[type="number"] {
    background: none; border: none; border-bottom: 1px solid rgba(224,179,85,0.3); border-radius: 0;
    padding: 0 0 7px; font-size: 15px;
  }
  .quest-form textarea {
    background: none; border: none; border-bottom: 1px solid rgba(224,179,85,0.3); border-radius: 0;
    padding: 0 0 7px; font-size: 15px; min-height: 40px;
  }
  .quest-form .segment-row { gap: 8px; }
  .quest-form .add-btn { margin-top: 0; }
  .item-suggest-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .item-suggest-chip {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; font-family: inherit;
    background: rgba(224,179,85,0.12); color: var(--gold); border: 1px solid rgba(224,179,85,0.45);
  }

  .field { position: relative; margin-top: 10px; }
  .field:first-child { margin-top: 0; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .field-row.item-qty-row { grid-template-columns: 2fr 1fr; }
  .field-row .field { margin-top: 0; }
  label { font-size: 11px; font-weight: 600; color: var(--subtext); display: block; margin-bottom: 4px; }
  input[type="text"], input[type="number"] {
    width: 100%; background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; font-family: inherit;
  }
  input::placeholder { color: var(--muted); }
  textarea {
    width: 100%; background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; font-family: inherit;
    resize: vertical; min-height: 56px;
  }
  textarea::placeholder { color: var(--muted); }

  .select-btn {
    width: 100%; background: var(--card-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font-size: 14px; text-align: left;
    display: flex; align-items: center; justify-content: space-between; font-family: inherit;
  }
  .select-btn.placeholder { color: var(--muted); }
  .dropdown {
    position: absolute; z-index: 30; top: 100%; left: 0; right: 0; margin-top: 4px;
    background: #123138; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
    max-height: 260px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .dropdown-item-row { display: flex; align-items: stretch; border-bottom: 1px solid rgba(224,179,85,0.2); }
  .dropdown-item-row:last-of-type { border-bottom: none; }
  .dropdown-item {
    flex: 1; text-align: left; padding: 10px 12px; font-size: 14px; background: none; border: none;
    color: var(--text); display: flex; align-items: center; justify-content: space-between; font-family: inherit; min-width: 0;
  }
  .dropdown-item-del {
    flex-shrink: 0; width: 38px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--muted);
  }
  .dropdown-add-row {
    width: 100%; text-align: left; padding: 10px 12px; font-size: 13px; font-weight: 600;
    background: none; border: none; color: var(--accent); display: flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .dropdown-add-input-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
  .dropdown-add-input-row input {
    flex: 1; background: var(--card-alt); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 16px; color: var(--text); outline: none; font-family: inherit;
  }
  .dropdown-add-confirm {
    background: var(--accent); border: none; border-radius: 8px; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent-ink); font-weight: 900;
  }

  /* Calendar */
  .cal-popover {
    position: absolute; z-index: 30; top: 100%; left: 0; right: 0; margin-top: 4px;
    background: #123138; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-header button { background: none; border: none; color: var(--subtext); font-size: 16px; padding: 4px 8px; }
  .cal-title { font-size: 13px; font-weight: 700; color: var(--gold); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px;
    border-radius: 8px; background: none; border: none; color: var(--text); font-family: inherit;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { color: var(--gold); font-weight: 700; }
  .cal-day.selected { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 0 8px rgba(111,224,200,0.6); }

  .add-btn {
    width: 100%; margin-top: 12px; padding: 11px; border-radius: 12px; border: 1.5px solid var(--accent);
    font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink); font-family: inherit;
  }
  .add-btn:disabled { background: rgba(255,255,255,0.06); color: var(--muted); border-color: var(--border); }

  /* Entry list (registration screen) */
  .entry-list-wrap { flex: 1; padding: 0 16px 16px; overflow-y: auto; }
  .list-label { font-size: 11px; font-weight: 600; color: var(--subtext); margin: 0 0 8px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; padding: 48px 0; text-align: center; color: var(--muted); font-size: 13px; }

  .entry-card {
    background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .entry-tag { font-size: 10px; font-weight: 700; background: rgba(224,179,85,0.18); color: var(--gold); padding: 2px 6px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(224,179,85,0.4); }
  .entry-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }
  .entry-del { background: none; border: none; padding: 6px; flex-shrink: 0; color: var(--subtext); display: flex; align-items: center; justify-content: center; }

  .register-footer { padding: 14px 16px; border-top: 1px solid var(--border); }
  .register-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--green); font-size: 15px; font-weight: 700;
    background: var(--green); color: var(--dark-green); display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit;
  }
  .register-btn:disabled { background: rgba(255,255,255,0.06); color: var(--muted); border-color: var(--border); }

  /* Board screen */
  .tabs { display: flex; gap: 6px; padding: 0 16px 12px; }
  .tab-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px;
    border-radius: 12px; border: 1.5px solid var(--border); font-size: 13px; font-weight: 700; background: var(--card); color: var(--subtext); font-family: inherit;
  }
  .tab-btn.active { box-shadow: 0 0 10px rgba(111,224,200,0.45); border-color: transparent; }
  .tab-count { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center; background: rgba(0,0,0,0.25); color: var(--text); }
  .tab-btn.active .tab-count { background: rgba(18,49,56,0.2); color: var(--dark-accent); }

  .board-list { flex: 1; padding: 0 16px 16px; overflow-y: auto; }
  .task-card { border-radius: 12px; margin-bottom: 10px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-left-width: 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
  .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .task-item { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .task-meta { font-size: 11px; color: var(--subtext); margin-top: 4px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .task-qty { font-size: 17px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
  .task-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .task-assignee { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--subtext); }
  .avatar { width: 20px; height: 20px; border-radius: 999px; background: rgba(224,179,85,0.2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .task-actions { display: flex; gap: 6px; }
  .task-action-btn {
    font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--subtext); font-family: inherit;
  }
  .task-action-btn.primary { color: #123138; border-color: transparent; }
  .date-group-header {
    font-size: 11px; font-weight: 700; color: var(--gold); margin: 16px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border); letter-spacing: 0.02em;
  }
  .date-group-header:first-child { margin-top: 0; }
  .footer-hint { padding: 10px 16px; text-align: center; font-size: 11px; color: var(--muted); }

  /* Flying confirmation dot + destination tab feedback */
  .fly-dot {
    position: fixed; width: 16px; height: 16px; border-radius: 999px; z-index: 250;
    background: var(--accent); box-shadow: 0 0 12px var(--accent); display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%);
    transition: left 0.5s cubic-bezier(0.3, 0.6, 0.3, 1), top 0.5s cubic-bezier(0.3, 0.6, 0.3, 1);
  }
  .tab-btn.bounce { transform: scale(1.15); box-shadow: 0 0 16px rgba(111,224,200,0.7); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease; z-index: 5; }
  .tab-count.pulse { background: var(--gold) !important; color: #123138 !important; transform: scale(1.3); transition: all 0.25s ease; }

  .swipe-wrap { position: relative; }
  .swipe-hint-bg {
    position: absolute; inset: 0; border-radius: 12px; overflow: hidden; display: flex; align-items: center;
    justify-content: space-between; padding: 0 16px; background: rgba(0,0,0,0.28); pointer-events: none;
  }
  .swipe-hint-left, .swipe-hint-right {
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px;
    opacity: 0; transform: scale(0.85); transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .swipe-hint-left { color: #E07B5A; }
  .swipe-hint-right { color: var(--accent); }

  .note-block { margin-top: 4px; }
  .note-text { color: var(--subtext); font-size: 11px; line-height: 1.45; margin: 0; }
  .note-text.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .note-more-btn {
    display: none; font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 2px;
    background: none; border: none; font-family: inherit; padding: 0;
  }
  .note-more-btn.visible { display: inline-block; }

  /* Quest-log style board task nodes */
  .board-quest-node { position: relative; padding-left: 26px; padding-bottom: 12px; }
  .board-quest-node:last-child { padding-bottom: 4px; }
  .board-quest-node::before {
    content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 1px;
    background: rgba(224,179,85,0.25);
  }
  .board-quest-node:last-child::before { display: none; }
  .board-quest-badge {
    position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 999px;
  }
  .board-quest-content {
    position: relative; padding: 12px; touch-action: pan-y;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
  }
  .task-icon-btn {
    width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none; color: var(--subtext); font-family: inherit;
  }
  .task-icon-btn.primary { border: none; color: #123138; }
  .task-actions-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* Search screen */
  .search-bar { display: flex; align-items: center; gap: 8px; margin: 0 16px 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-alt); border: 1px solid var(--border); }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; font-family: inherit; }
  .search-bar input::placeholder { color: var(--muted); }
  .search-clear { background: none; border: none; color: var(--subtext); display: flex; align-items: center; padding: 2px; }

  .chip-row { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; }
  .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--subtext); font-family: inherit; white-space: nowrap; }
  .chip.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 8px rgba(111,224,200,0.5); }

  .month-filter-wrap { padding: 0 16px 14px; position: relative; }
  .month-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--subtext); font-family: inherit; }
  .month-pill.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 8px rgba(111,224,200,0.5); }
  .month-pill-clear { margin-left: 2px; display: inline-flex; align-items: center; }

  .month-popover { position: absolute; z-index: 20; top: 100%; margin-top: 8px; left: 16px; right: 60px; border-radius: 12px; padding: 12px; background: #123138; border: 1.5px solid var(--border); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  .month-pop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-pop-header button { background: none; border: none; color: var(--subtext); padding: 4px; }
  .month-pop-year { font-size: 13px; font-weight: 700; color: var(--gold); }
  .month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .month-cell { padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.05); color: var(--text); border: none; font-family: inherit; }
  .month-cell.active { background: var(--accent); color: var(--accent-ink); }

  .results-count { font-size: 11px; color: var(--muted); margin: 0 16px 8px; }

  /* Photo attachment */
  .photo-picker-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    padding: 14px; border-radius: 12px; border: 1.5px dashed var(--border); background: var(--card-alt);
    color: var(--subtext); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .photo-preview-wrap { position: relative; width: 84px; }
  .photo-preview { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; border: 1.5px solid var(--border); display: block; }
  .photo-remove {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 999px;
    background: #123138; border: 1.5px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center;
  }
  .entry-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }
  .task-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }

  /* Segmented category selector */
  .segment-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .segment-btn {
    padding: 9px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card-alt);
    color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit; display: flex; align-items: center; gap: 6px;
  }
  .segment-btn.active {
    border-color: var(--accent); color: var(--accent); background: rgba(111,224,200,0.1);
    box-shadow: 0 0 8px rgba(111,224,200,0.4);
  }
  .segment-btn.add-segment { color: var(--gold); border-style: dashed; }
  .segment-del { display: flex; align-items: center; color: var(--accent); opacity: 0.8; }
  .segment-add-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .segment-add-row input {
    flex: 1; background: var(--card-alt); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 16px; color: var(--text); outline: none; font-family: inherit;
  }
  .segment-add-confirm {
    background: var(--accent); border: none; border-radius: 8px; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent-ink); font-weight: 900;
  }

  /* Restock (入荷待ち) */
  .restock-row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); position: relative; display: flex; flex-wrap: wrap; gap: 16px; }
  .restock-set-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    border: 1px dashed var(--border); background: transparent; color: var(--subtext); font-size: 11px; font-weight: 600; font-family: inherit;
  }
  .restock-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--gold); background: rgba(224,179,85,0.12); color: var(--gold); font-size: 11px; font-weight: 700; font-family: inherit;
  }
  .restock-badge.due { border-color: #E07B5A; color: #E07B5A; background: rgba(224,123,90,0.14); }

async function storageGet(key) {
  try {
    if (window.storage) {
      const r = await window.storage.get(key);
      return r ? r.value : null;
    }
  } catch (e) {}
  try {
    return localStorage.getItem(key);
  } catch (e) {}
  return null;
}

async function storageSet(key, value) {
  try {
    if (window.storage) {
      await window.storage.set(key, value);
      return;
    }
  } catch (e) {}
  try {
    localStorage.setItem(key, value);

}

  return `${y}-${m}-${day}`;

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fmtDateShort(iso) {
  if (!iso) return "日付未設定";

}

function addOption(listKey, value) {
  const trimmed = value.trim();
  if (!trimmed) return;
  if (!state[listKey].includes(trimmed)) {
    state[listKey] = [...state[listKey], trimmed];
    saveState();
  }
}

function deleteOption(kind, value) {
  const cfg = KIND_CONFIG[kind];
  state[cfg.listKey] = state[cfg.listKey].filter((v) => v !== value);
  if (ui.draft[cfg.draftKey] === value) ui.draft[cfg.draftKey] = "";
  if (kind === "dest") {
    state.favoriteDestinations = state.favoriteDestinations.filter((v) => v !== value);
  }
  saveState();
  render();
}

function toggleFavoriteDest(value) {
  if (state.favoriteDestinations.includes(value)) {

function findDuplicateTask(dest, item, shipDate) {
  return state.tasks.find(
    (t) => (t.status === "todo" || t.status === "doing") && t.dest === dest && t.item === item && t.shipDate === shipDate
  );
}

function resetDraftFields() {
  ui.draft = { dest: "", item: "", qty: "", note: "", assignee: "", shipDate: todayISO(), deliveryDate: null, category: "", photo: null };
}

function addDraftEntry() {
  if (!isValidDraft()) return;
  const dupe = findDuplicateTask(ui.draft.dest, ui.draft.item.trim(), ui.draft.shipDate);
  if (dupe) {
    ui.pendingDuplicateEntry = buildDraftEntry();
    ui.duplicateWarningTask = dupe;
    render();
    return;
  }
  ui.draftList.push(buildDraftEntry());
  recordRecentItem(ui.draft.item);
  resetDraftFields();
  render();
}

function removeDraftEntry(id) {
  ui.draftList = ui.draftList.filter((e) => e.id !== id);

function registerAll() {
  if (ui.draftList.length === 0) return;
  const newTasks = ui.draftList.map((e) => ({ ...e, id: Date.now() + Math.random(), status: "todo" }));
  state.tasks = [...state.tasks, ...newTasks];
  saveState();
  ui.draftList = [];
  ui.screen = "board";
  ui.boardTab = "todo";
  render();
}

function moveTask(id, direction) {
  const map = direction === "next" ? NEXT_STATUS : PREV_STATUS;
  state.tasks = state.tasks.map((t) => {
    if (t.id !== id) return t;
    const to = map[t.status];
    if (!to) return t;
    const completedDate = to === "done" ? todayISO() : null;
    return { ...t, status: to, completedDate };
  });
  saveState();
  render();
}

function flyDotToTab(startRect, destKey) {
  const tabEl = document.querySelector(`[data-action="set-tab"][data-tab="${destKey}"]`);
  if (!tabEl) return;
  const tabRect = tabEl.getBoundingClientRect();

  const dot = document.createElement("div");
  dot.className = "fly-dot";
  dot.style.transition = "none";
  dot.style.left = (startRect.left + startRect.width / 2) + "px";
  dot.style.top = (startRect.top + startRect.height / 2) + "px";
  document.body.appendChild(dot);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      dot.style.transition = "left 0.5s cubic-bezier(0.3,0.6,0.3,1), top 0.5s cubic-bezier(0.3,0.6,0.3,1)";
      dot.style.left = (tabRect.left + tabRect.width / 2) + "px";
      dot.style.top = (tabRect.top + tabRect.height / 2) + "px";
    });
  });

  dot.addEventListener("transitionend", () => {
    dot.remove();
    const freshTabEl = document.querySelector(`[data-action="set-tab"][data-tab="${destKey}"]`);
    if (!freshTabEl) return;
    freshTabEl.classList.add("bounce");
    const countEl = freshTabEl.querySelector(".tab-count");
    if (countEl) countEl.classList.add("pulse");
    setTimeout(() => {
      freshTabEl.classList.remove("bounce");
      if (countEl) countEl.classList.remove("pulse");
    }, 400);
  }, { once: true });
}

function renderCalendar() {

  let cells = "";

      <div class="cal-grid">

}


function renderEditShipDateCalendar() {
  const year = ui.shipDateEditCalViewYear, month = ui.shipDateEditCalViewMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const ed = ui.editDraft;
  const selected = (ed && ed.shipDate && ed.shipDate !== "TBD") ? new Date(ed.shipDate + "T00:00:00") : null;

  let cells = "";
  for (let i = 0; i < firstDay; i++) cells += `<button class="cal-day empty"></button>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
    const isSelected = selected && selected.getFullYear() === year && selected.getMonth() === month && selected.getDate() === d;
    cells += `<button class="cal-day ${isSelected ? "selected" : isToday ? "today" : ""}" data-action="pick-edit-shipdate" data-day="${d}">${d}</button>`;
  }

  return `
    <div class="cal-popover" style="left:auto;right:0;width:240px;">
      <div class="cal-header">
        <button data-action="edit-shipdate-cal-prev">‹</button>
        <span class="cal-title">${year}年${month + 1}月</span>
        <button data-action="edit-shipdate-cal-next">›</button>
      </div>
      <div class="cal-grid">
        ${DOW.map((d) => `<div class="cal-dow">${d}</div>`).join("")}
        ${cells}
      </div>
    </div>`;
}

function renderTaskCard(t, accent) {
  const hasPrev = !!PREV_STATUS[t.status];
  const hasNext = !!NEXT_STATUS[t.status];
  const isDue = t.restockDate && t.restockDate !== "TBD" && t.restockDate <= todayISO();
  const noticeIsDue = t.noticeDate && t.noticeDate <= todayISO();

  const restockLabel = t.restockDate
    ? (t.restockDate === "TBD" ? "日付未定" : fmtDateShort(t.restockDate).replace("出荷", ""))
    : "入荷待ちにする";
  const noticeLabel = t.noticeDate
    ? `${t.noticeText || "お知らせ"} ${fmtDateShort(t.noticeDate).replace("出荷", "")}`
    : "お知らせを設定";
  const restockColor = t.restockDate ? (isDue ? "#E07B5A" : "var(--gold)") : "var(--muted)";
  const noticeColor = t.noticeDate ? (noticeIsDue ? "#E07B5A" : "var(--accent)") : "var(--muted)";
  const restockCircleBg = t.restockDate ? (isDue ? "#E07B5A" : "var(--gold)") : "rgba(0,0,0,0.3)";
  const noticeCircleBg = t.noticeDate ? (noticeIsDue ? "#E07B5A" : "var(--accent)") : "rgba(0,0,0,0.3)";

  const restockControl = t.status === "done" ? "" : `
    <div class="restock-row">
      <span class="icon-label-badge" data-action="toggle-restock-cal" data-id="${t.id}">
        <span class="icon-label-circle" style="background:${restockCircleBg};">${ICON_BOX}</span>
        <span class="icon-label-text" style="color:${restockColor};">${escapeHtml(restockLabel)}</span>
        ${t.restockDate ? `<span class="icon-label-clear" data-action="clear-restock-date" data-id="${t.id}">${ICON_X}</span>` : ""}
      </span>
      <span class="icon-label-badge" data-action="toggle-notice-editor" data-id="${t.id}">
        <span class="icon-label-circle" style="background:${noticeCircleBg};">${ICON_MEGAPHONE}</span>
        <span class="icon-label-text" style="color:${noticeColor};">${escapeHtml(noticeLabel)}</span>
        ${t.noticeDate ? `<span class="icon-label-clear" data-action="clear-notice" data-id="${t.id}">${ICON_X}</span>` : ""}
      </span>
      ${String(ui.restockEditingId) === String(t.id) ? renderRestockCalendar(t) : ""}
      ${String(ui.noticeEditingId) === String(t.id) ? renderNoticeEditor(t) : ""}
    </div>`;

  const menuOpen = String(ui.taskMenuOpenId) === String(t.id);
  const showMoreMenu = t.status !== "done";

  return `
    <div class="board-quest-node">
      <div class="board-quest-badge" style="background:${accent};box-shadow:0 0 6px ${accent}99;"></div>
      <div class="swipe-wrap">
        <div class="swipe-hint-bg">
          <span class="swipe-hint-left">${ICON_CHEVRON_L}戻す</span>
          <span class="swipe-hint-right">進める${ICON_CHEVRON_R}</span>
        </div>
        <div class="board-quest-content" data-task-id="${t.id}" data-status="${t.status}">
        ${t.status === "done" ? `<div class="quest-complete-stamp">作業完了${t.completedDate ? `<span class="stamp-date">${fmtDateShort(t.completedDate).replace("出荷", "")}</span>` : ""}</div>` : ""}
        ${showMoreMenu && menuOpen ? `
          <div class="task-menu">
            <button data-action="start-edit-task" data-id="${t.id}">編集</button>
            <button data-action="start-delete-confirm" data-id="${t.id}">削除</button>
          </div>` : ""}
        <div class="task-top">
          ${t.photo ? `<img src="${t.photo}" class="task-thumb" data-tap-id="task-${t.id}">` : ""}
          <div style="min-width:0;flex:1;">
            <div class="task-item">${escapeHtml(t.dest)}</div>
            <div class="task-meta">
              <span style="font-size:13px;font-weight:600;color:var(--text);">${escapeHtml(t.item)}</span>
              ${t.category ? `<span>・</span><span>${escapeHtml(t.category)}</span>` : ""}
              ${t.deliveryDate ? `<span>・</span><span>納品 ${fmtDateShort(t.deliveryDate).replace("出荷", "")}</span>` : ""}
              <span>・</span><span>${t.assignee ? escapeHtml(t.assignee) : "担当未定"}</span>
            </div>
            ${t.note ? `
              <div class="note-block">
                <p class="note-text ${ui.expandedNoteIds.includes(String(t.id)) ? "" : "clamped"}" data-note-id="${t.id}">${escapeHtml(t.note)}</p>
                <button class="note-more-btn ${ui.expandedNoteIds.includes(String(t.id)) ? "visible" : ""}" data-action="toggle-note-expand" data-id="${t.id}">
                  ${ui.expandedNoteIds.includes(String(t.id)) ? "閉じる" : "続きを見る"}
                </button>
              </div>
            ` : ""}
          </div>
          <div class="task-actions-row">
            <span class="task-qty" style="color:${accent};">${t.qty}枚</span>
            ${showMoreMenu ? `<button class="task-more-btn" data-action="toggle-task-menu" data-id="${t.id}">⋯</button>` : ""}
          </div>
        </div>
        ${restockControl}
        </div>
      </div>
    </div>`;
}

function renderBoardScreen() {
  const counts = {};
  COLUMNS.forEach((c) => counts[c.key] = state.tasks.filter((t) => t.status === c.key).length);
  const activeCol = COLUMNS.find((c) => c.key === ui.boardTab);
  const visible = state.tasks.filter((t) => t.status === ui.boardTab);
  if (ui.boardTab !== "done") {
    const sortKey = (d) => (!d || d === "TBD" ? "9999-99-99" : d);
    visible.sort((a, b) => sortKey(a.shipDate).localeCompare(sortKey(b.shipDate)));
  }

  const tabs = COLUMNS.map((col) => `
    <button class="tab-btn ${ui.boardTab === col.key ? "active" : ""}"
      style="${ui.boardTab === col.key ? `background:${col.accent};color:#123138;` : ""}"
      data-action="set-tab" data-tab="${col.key}">
      <span>${col.label}</span>
      <span class="tab-count">${counts[col.key]}</span>
    </button>`).join("");

  let listHtml;
  if (visible.length === 0) {
    listHtml = `<div class="empty-state">${activeCol.label}の案件はありません</div>`;
  } else {
    // Group by ship date: done tab shows most recent first, others show soonest first
    const groups = {};
    visible.forEach((t) => {
      const key = t.shipDate || "unknown";
      (groups[key] = groups[key] || []).push(t);
    });
    const keys = Object.keys(groups).sort((a, b) => {
      if (a === "TBD" || a === "unknown") return 1;
      if (b === "TBD" || b === "unknown") return -1;
      return ui.boardTab === "done" ? b.localeCompare(a) : a.localeCompare(b);
    });
    listHtml = keys.map((k) => `
      <div class="date-group-header">${k === "unknown" ? "日付未設定" : fmtDateShort(k)}</div>
      ${groups[k].map((t) => renderTaskCard(t, activeCol.accent)).join("")}
    `).join("");
  }

  return `
    <div class="tabs">${tabs}</div>
    <div class="board-list">${listHtml}</div>
    <div class="footer-hint">${ui.boardTab === "done" ? "完了した案件の履歴です" : "カードを左右にスワイプでステータスを変更できます"}</div>`;
}

function getSearchResults() {
  const q = ui.searchQuery.trim();
  return state.tasks
    .filter((t) => t.status === "done")
    .filter((t) => {
      const matchQuery =
        !q || t.item.includes(q) || t.dest.includes(q) || (t.assignee || "").includes(q) || (t.note || "").includes(q);
      const matchCategory = ui.searchCategory === "すべて" || t.category === ui.searchCategory;
      let matchMonth = true;
      if (ui.selectedMonth && t.shipDate && t.shipDate !== "TBD") {
        const d = new Date(t.shipDate + "T00:00:00");
        matchMonth = d.getFullYear() === ui.selectedMonth.year && d.getMonth() + 1 === ui.selectedMonth.month;
      } else if (ui.selectedMonth) {
        matchMonth = false;
      }
      return matchQuery && matchCategory && matchMonth;
    })
    .sort((a, b) => (b.shipDate || "").localeCompare(a.shipDate || ""));
}

function renderSearchScreen() {
  const results = getSearchResults();
  const categoryOptions = ["すべて", ...state.categories];

  const chips = categoryOptions.map((c) => `
    <button class="chip ${ui.searchCategory === c ? "active" : ""}" data-action="set-search-category" data-value="${escapeAttr(c)}">
      ${escapeHtml(c)}
    </button>`).join("");

  const monthLabel = ui.selectedMonth ? `${ui.selectedMonth.year}年${ui.selectedMonth.month}月` : "期間: すべて";

  const monthGrid = Array.from({ length: 12 }, (_, i) => i + 1).map((m) => {
    const active = ui.selectedMonth && ui.selectedMonth.year === ui.monthViewYear && ui.selectedMonth.month === m;
    return `<button class="month-cell ${active ? "active" : ""}" data-action="pick-month" data-month="${m}">${m}月</button>`;
  }).join("");

  const monthPopover = ui.monthOpen ? `
    <div class="month-popover">
      <div class="month-pop-header">
        <button data-action="month-prev-year">${ICON_CHEVRON_L}</button>
        <span class="month-pop-year">${ui.monthViewYear}年</span>
        <button data-action="month-next-year">${ICON_CHEVRON_R}</button>
      </div>
      <div class="month-grid">${monthGrid}</div>
    </div>` : "";

  let listHtml;
  if (results.length === 0) {
    listHtml = `<div class="empty-state">該当する案件がありません</div>`;
  } else {
    const groups = {};
    results.forEach((t) => {
      const key = t.shipDate || "unknown";
      (groups[key] = groups[key] || []).push(t);
    });
    const keys = Object.keys(groups).sort((a, b) => {
      if (a === "TBD") return 1;
      if (b === "TBD") return -1;
      return b.localeCompare(a);
    });
    listHtml = keys.map((k) => `
      <div class="date-group-header">${k === "unknown" ? "日付未設定" : fmtDateShort(k)}</div>
      ${groups[k].map((t) => renderTaskCard(t, "#E0B355")).join("")}
    `).join("");
  }

  return `
    <div class="search-bar">
      <span style="color:var(--gold);display:flex;">${ICON_SEARCH}</span>
      <input id="search-input" type="text" placeholder="商品名・販売先・担当者で検索" value="${escapeAttr(ui.searchQuery)}">
      ${ui.searchQuery ? `<button class="search-clear" data-action="clear-search">${ICON_X}</button>` : ""}
    </div>
    <div class="chip-row">${chips}</div>
    <div class="month-filter-wrap">
      <button class="month-pill ${ui.selectedMonth ? "active" : ""}" data-action="toggle-month">
        ${ICON_CAL} ${monthLabel}
        ${ui.selectedMonth ? `<span class="month-pill-clear" data-action="clear-month">${ICON_X}</span>` : ""}
      </button>
      ${monthPopover}
    </div>
    <p class="results-count">${results.length}件見つかりました</p>
    <div class="board-list" style="padding-top:0;">${listHtml}</div>`;
}

function render() {
  const totalQty = ui.draftList.reduce((s, e) => s + e.qty, 0);
  const app = document.getElementById("app");
  const titleMap = { entry: "本日の案件登録", board: "ピッキング進捗", search: "完了案件を検索" };
  app.innerHTML = `
    <div class="header">
      <div class="header-title-row">
        <div class="header-bar"></div>
        <h1 class="header-title">${titleMap[ui.screen]}</h1>
      </div>
      <p class="header-sub">${
        ui.screen === "entry" ? `登録予定 ${ui.draftList.length}件 ・ 計${totalQty}枚`
        : ui.screen === "board" ? `全${state.tasks.length}件`
        : "過去の完了・取り置き履歴から探せます"
      }</p>
    </div>
    <div class="nav-switch">
      <button class="nav-btn ${ui.screen === "entry" ? "active" : ""}" data-action="go-entry">案件登録</button>
      <button class="nav-btn ${ui.screen === "board" ? "active" : ""}" data-action="go-board">進捗ボード</button>
      <button class="nav-btn ${ui.screen === "search" ? "active" : ""}" data-action="go-search">検索</button>
    </div>
    <div class="screen active">
      ${ui.screen === "entry" ? renderEntryScreen() : ui.screen === "board" ? renderBoardScreen() : renderSearchScreen()}
    </div>
    ${ui.showRestockModal ? renderRestockModal() : ""}
    ${ui.showNoticeModal ? renderNoticeModal() : ""}

    ${ui.deleteConfirmId ? renderDeleteConfirmModal() : ""}

  // restore focus-friendly inputs
  bindInputs();
  checkNoteOverflow();
}

function checkNoteOverflow() {
  document.querySelectorAll(".note-text.clamped").forEach((el) => {
    const btn = document.querySelector(`.note-more-btn[data-id="${el.dataset.noteId}"]`);
    if (btn && el.scrollHeight > el.clientHeight + 1) {
      btn.classList.add("visible");
    }
  });
}

function openLightbox(photo, item, dest, qty) {
  if (!photo) return;
  ui.lightboxPhoto = { photo, item, dest, qty };
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById("photo-lightbox-overlay");
    if (el) el.classList.add("open");
  });
}

function closeLightboxAnimated() {
  const el = document.getElementById("photo-lightbox-overlay");
  if (el) el.classList.remove("open");
  setTimeout(() => {
    ui.lightboxPhoto = null;
    render();
  }, 220);
}

function openLightboxFromTapId(tapId) {
  let info = null;
  if (tapId.startsWith("task-")) {
    const id = tapId.slice(5);
    const t = state.tasks.find((x) => String(x.id) === id);
    if (t) info = { photo: t.photo, item: t.item, dest: t.dest, qty: t.qty };
  } else if (tapId.startsWith("draft-")) {
    const id = tapId.slice(6);
    const e = ui.draftList.find((x) => String(x.id) === id);
    if (e) info = { photo: e.photo, item: e.item, dest: e.dest, qty: e.qty };
  }
  if (info) openLightbox(info.photo, info.item, info.dest, info.qty);
}

  const p = ui.lightboxPhoto;
  return `

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ---------- Swipe left/right on a task card to change status ---------- */
let swipeState = { active: false, dragging: false };
let swipeSuppressClick = false;
const SWIPE_THRESHOLD = 70;

document.addEventListener("pointerdown", (e) => {
  const content = e.target.closest(".board-quest-content");
  if (!content) return;
  if (ui.screen !== "board") return;
  swipeState = {
    active: true, dragging: false, el: content,
    startX: e.clientX, startY: e.clientY, lastDx: 0,
    taskId: content.dataset.taskId, status: content.dataset.status,
  };
});

document.addEventListener("pointermove", (e) => {
  if (!swipeState.active) return;
  const dx = e.clientX - swipeState.startX;
  const dy = e.clientY - swipeState.startY;
  if (!swipeState.dragging) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      swipeState.dragging = true;
    } else if (Math.abs(dy) > 10) {
      swipeState.active = false;
      return;
    } else {
      return;
    }
  }
  const canNext = !!NEXT_STATUS[swipeState.status];
  const canPrev = !!PREV_STATUS[swipeState.status];
  let clamped = Math.max(-110, Math.min(110, dx));
  if (clamped > 0 && !canNext) clamped = 0;
  if (clamped < 0 && !canPrev) clamped = 0;
  swipeState.lastDx = clamped;
  swipeState.el.style.transition = "none";
  swipeState.el.style.transform = `translateX(${clamped}px)`;

  const overThreshold = Math.abs(clamped) >= SWIPE_THRESHOLD;
  swipeState.el.style.boxShadow = overThreshold ? `0 0 14px 1px ${clamped > 0 ? "var(--accent)" : "#E07B5A"}` : "none";
  swipeState.el.style.borderColor = overThreshold ? (clamped > 0 ? "var(--accent)" : "#E07B5A") : "";

  const hintBg = swipeState.el.parentElement && swipeState.el.parentElement.querySelector(".swipe-hint-bg");
  if (hintBg) {
    const rightOpacity = Math.max(0, Math.min(1, clamped / SWIPE_THRESHOLD));
    const leftOpacity = Math.max(0, Math.min(1, -clamped / SWIPE_THRESHOLD));
    const rightEl = hintBg.querySelector(".swipe-hint-right");
    const leftEl = hintBg.querySelector(".swipe-hint-left");
    if (rightEl) { rightEl.style.opacity = rightOpacity; rightEl.style.transform = `scale(${0.85 + rightOpacity * 0.15})`; }
    if (leftEl) { leftEl.style.opacity = leftOpacity; leftEl.style.transform = `scale(${0.85 + leftOpacity * 0.15})`; }
  }
});

document.addEventListener("pointerup", () => {
  if (!swipeState.active) return;
  if (swipeState.dragging && swipeState.el) {
    const el = swipeState.el;
    const dx = swipeState.lastDx;
    el.style.transition = "transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease";
    el.style.transform = "translateX(0)";
    el.style.boxShadow = "none";
    el.style.borderColor = "";
    const hintBg = el.parentElement && el.parentElement.querySelector(".swipe-hint-bg");
    if (hintBg) {
      const rightEl = hintBg.querySelector(".swipe-hint-right");
      const leftEl = hintBg.querySelector(".swipe-hint-left");
      if (rightEl) { rightEl.style.opacity = 0; rightEl.style.transform = "scale(0.85)"; }
      if (leftEl) { leftEl.style.opacity = 0; leftEl.style.transform = "scale(0.85)"; }
    }
    const task = state.tasks.find((t) => String(t.id) === String(swipeState.taskId));
    if (task) {
      if (dx > SWIPE_THRESHOLD && NEXT_STATUS[task.status]) {
        swipeSuppressClick = true;
        const rect = el.getBoundingClientRect();
        const destKey = NEXT_STATUS[task.status];
        moveTask(task.id, "next");
        flyDotToTab(rect, destKey);
      } else if (dx < -SWIPE_THRESHOLD && PREV_STATUS[task.status]) {
        swipeSuppressClick = true;
        const rect = el.getBoundingClientRect();
        const destKey = PREV_STATUS[task.status];
        moveTask(task.id, "prev");
        flyDotToTab(rect, destKey);
      }
    }
  }
  swipeState = { active: false, dragging: false };
});

/* ---------- Event delegation ---------- */
document.addEventListener("click", (e) => {
  if (swipeSuppressClick) {
    swipeSuppressClick = false;
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  // a long-press just fired the delete-confirm modal; swallow the trailing click so it doesn't also select
  if (destPressTriggered && e.target.closest(".dest-tile-btn")) {
    destPressTriggered = false;
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  const btn = e.target.closest("[data-action]");
  if (!btn) {
    // close dropdowns/calendar on outside click
    if (!e.target.closest(".field") && !e.target.closest(".month-filter-wrap") && !e.target.closest(".search-bar") && !e.target.closest(".restock-row") && !e.target.closest(".task-card")) {
      ui.destOpen = ui.assigneeOpen = ui.calOpen = ui.categoryOpen = ui.deliveryCalOpen = false;
      ui.monthOpen = false;
      ui.restockEditingId = null;
      ui.noticeEditingId = null;
      ui.taskMenuOpenId = null;
      ui.shipDateEditingId = null;
      render();
    }
    return;
  }
  const action = btn.dataset.action;

  switch (action) {
    case "go-entry": ui.screen = "entry"; render(); break;
    case "go-board": ui.screen = "board"; render(); break;
    case "go-search": ui.screen = "search"; render(); break;
    case "clear-search": ui.searchQuery = ""; render(); break;
    case "set-search-category": ui.searchCategory = btn.dataset.value; render(); break;
    case "toggle-month": ui.monthOpen = !ui.monthOpen; render(); break;
    case "month-prev-year": ui.monthViewYear--; render(); break;
    case "month-next-year": ui.monthViewYear++; render(); break;
    case "pick-month":
      ui.selectedMonth = { year: ui.monthViewYear, month: Number(btn.dataset.month) };
      ui.monthOpen = false;
      render();
      break;
    case "clear-month": ui.selectedMonth = null; render(); break;
    case "toggle-restock-cal": {
      const id = btn.dataset.id;
      if (ui.restockEditingId === id) {
        ui.restockEditingId = null;
      } else {
        ui.restockEditingId = id;
        const task = state.tasks.find((t) => String(t.id) === String(id));
        const base = (task && task.restockDate && task.restockDate !== "TBD") ? new Date(task.restockDate + "T00:00:00") : new Date();
        ui.restockCalViewYear = base.getFullYear();
        ui.restockCalViewMonth = base.getMonth();
      }
      render();
      break;
    }
    case "restock-cal-prev":
      ui.restockCalViewMonth--;
      if (ui.restockCalViewMonth < 0) { ui.restockCalViewMonth = 11; ui.restockCalViewYear--; }
      render();
      break;
    case "restock-cal-next":
      ui.restockCalViewMonth++;
      if (ui.restockCalViewMonth > 11) { ui.restockCalViewMonth = 0; ui.restockCalViewYear++; }
      render();
      break;
    case "pick-restock-date": {
      const d = new Date(ui.restockCalViewYear, ui.restockCalViewMonth, Number(btn.dataset.day));
      if (isNaN(d.getTime())) break;
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (task) setRestockDate(task.id, toISODateLocal(d));
      break;
    }
    case "pick-restock-tbd": {
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (task) setRestockDate(task.id, "TBD");
      break;
    }
    case "clear-restock-date": {
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (task) clearRestockDate(task.id);
      break;
    }
    case "toggle-notice-editor": {
      const id = btn.dataset.id;
      if (ui.noticeEditingId === id) {
        ui.noticeEditingId = null;
      } else {
        ui.noticeEditingId = id;
        const task = state.tasks.find((t) => String(t.id) === String(id));
        ui.noticeDraftText = task ? (task.noticeText || "") : "";
        const base = task && task.noticeDate ? new Date(task.noticeDate + "T00:00:00") : new Date();
        ui.noticeCalViewYear = base.getFullYear();
        ui.noticeCalViewMonth = base.getMonth();
      }
      render();
      break;
    }
    case "notice-cal-prev":
      ui.noticeCalViewMonth--;
      if (ui.noticeCalViewMonth < 0) { ui.noticeCalViewMonth = 11; ui.noticeCalViewYear--; }
      render();
      break;
    case "notice-cal-next":
      ui.noticeCalViewMonth++;
      if (ui.noticeCalViewMonth > 11) { ui.noticeCalViewMonth = 0; ui.noticeCalViewYear++; }
      render();
      break;
    case "pick-notice-date": {
      const d = new Date(ui.noticeCalViewYear, ui.noticeCalViewMonth, Number(btn.dataset.day));
      if (isNaN(d.getTime())) break;
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));

      break;
    }
    case "dismiss-notice-modal": dismissNoticeModal(); break;
    case "dismiss-restock-modal": dismissRestockModal(); break;

    case "toggle-task-menu": {

      ui.taskMenuOpenId = String(ui.taskMenuOpenId) === String(id) ? null : id;
      ui.shipDateEditingId = null;
      ui.deleteConfirmId = null;
      render();
      break;
    }
    case "start-edit-shipdate": {
      const id = btn.dataset.id;
      ui.taskMenuOpenId = null;
      ui.shipDateEditingId = id;

      const base = task && task.shipDate && task.shipDate !== "TBD" ? new Date(task.shipDate + "T00:00:00") : new Date();
      ui.shipDateEditCalViewYear = base.getFullYear();
      ui.shipDateEditCalViewMonth = base.getMonth();
      render();
      break;
    }
    case "shipdate-edit-cal-prev":
      ui.shipDateEditCalViewMonth--; if (ui.shipDateEditCalViewMonth < 0) { ui.shipDateEditCalViewMonth = 11; ui.shipDateEditCalViewYear--; } render(); break;
    case "shipdate-edit-cal-next":
      ui.shipDateEditCalViewMonth++; if (ui.shipDateEditCalViewMonth > 11) { ui.shipDateEditCalViewMonth = 0; ui.shipDateEditCalViewYear++; } render(); break;
    case "pick-shipdate-edit": {
      const d = new Date(ui.shipDateEditCalViewYear, ui.shipDateEditCalViewMonth, Number(btn.dataset.day));
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (task) setTaskShipDate(task.id, toISODateLocal(d));
      break;
    }
    case "start-delete-confirm":
      ui.taskMenuOpenId = null;
      ui.deleteConfirmId = btn.dataset.id;
      render();
      break;
    case "cancel-delete-task": ui.deleteConfirmId = null; render(); break;
    case "confirm-delete-task": {
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (task) deleteTask(task.id);
      break;
    }
    case "cancel-delete-dest": ui.deleteDestConfirm = null; render(); break;
    case "confirm-delete-dest": {
      const val = ui.deleteDestConfirm;
      ui.deleteDestConfirm = null;
      if (val) deleteOption("dest", val);
      break;
    }
    case "start-edit-task": {
      ui.taskMenuOpenId = null;
      const task = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (task) {
        ui.editingTaskId = task.id;
        ui.editShipDateCalOpen = false;
        ui.editDraft = {
          item: task.item, qty: task.qty, dest: task.dest, shipDate: task.shipDate,
          assignee: task.assignee || "", category: task.category || "", note: task.note || "",
          photo: task.photo || null,
        };
        const base = task.shipDate && task.shipDate !== "TBD" ? new Date(task.shipDate + "T00:00:00") : new Date();
        ui.shipDateEditCalViewYear = base.getFullYear();
        ui.shipDateEditCalViewMonth = base.getMonth();
        render();
      }
      break;
    }
    case "cancel-edit-task": ui.editingTaskId = null; ui.editDraft = null; ui.editShipDateCalOpen = false; render(); break;
    case "cancel-edit-task-overlay":
      if (btn.classList.contains("modal-overlay") && e.target.closest(".edit-modal-dialog")) break;
      ui.editingTaskId = null; ui.editDraft = null; render();
      break;
    case "confirm-edit-task": {
      const task = state.tasks.find((t) => String(t.id) === String(ui.editingTaskId));
      if (task && ui.editDraft) {
        const ed = ui.editDraft;
        state.tasks = state.tasks.map((t) => t.id === task.id ? {
          ...t,
          item: ed.item.trim() || t.item,
          qty: ed.qty === "" ? t.qty : Number(ed.qty),
          dest: ed.dest || t.dest,
          shipDate: ed.shipDate || t.shipDate,
          assignee: ed.assignee,
          category: ed.category,
          note: ed.note,
          photo: ed.photo,
        } : t);
        saveState();
      }
      ui.editingTaskId = null;
      ui.editDraft = null;
      ui.editShipDateCalOpen = false;
      render();
      break;

      const id = String(btn.dataset.id);
      if (ui.expandedNoteIds.includes(id)) {
        ui.expandedNoteIds = ui.expandedNoteIds.filter((x) => x !== id);
      } else {
        ui.expandedNoteIds = [...ui.expandedNoteIds, id];
      }
      render();
      break;
    }
    case "pick-recent-item":
      ui.draft.item = btn.dataset.value;
      render();
      break;
    case "confirm-duplicate-add": {
      if (ui.pendingDuplicateEntry) {
        ui.draftList.push(ui.pendingDuplicateEntry);
        recordRecentItem(ui.pendingDuplicateEntry.item);
        resetDraftFields();
      }
      ui.pendingDuplicateEntry = null;
      ui.duplicateWarningTask = null;
      render();
      break;
    }
    case "cancel-duplicate-add":
      ui.pendingDuplicateEntry = null;
      ui.duplicateWarningTask = null;
      render();
      break;
    case "remove-draft": removeDraftEntry(Number(btn.dataset.id) || btn.dataset.id); break;
    case "register-all": registerAll(); break;

    case "set-tab": ui.boardTab = btn.dataset.tab; render(); break;
    case "next-task": {
      const match = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (match) moveTask(match.id, "next");
      break;
    }
    case "prev-task": {
      const match = state.tasks.find((t) => String(t.id) === String(btn.dataset.id));
      if (match) moveTask(match.id, "prev");
      break;
    }
  }
});

function focusNewInput(kind) {
  setTimeout(() => {
    const input = document.getElementById(`new-${kind}-input`);
    if (input) {
      input.focus();
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmAdd(kind); });
    }
  }, 0);
}

function confirmAdd(kind) {
  const input = document.getElementById(`new-${kind}-input`);
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  const cfg = KIND_CONFIG[kind];
  addOption(cfg.listKey, val);
  ui.draft[cfg.draftKey] = val;
  ui[kind + "Open"] = false;
  ui[kind + "Adding"] = false;
  render();
}

function confirmAddCategorySeg() {
  const input = document.getElementById("new-category-seg-input");
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  addOption("categories", val);
  ui.draft.category = val;
  ui.categoryAdding = false;
  render();
}

render();

// Load any previously saved data asynchronously, then re-render if found.
(async () => {
  try {
    const raw = await storageGet(LS_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      loaded.categories = ["スポット", "取り置き", "初回"];
      if (!loaded.favoriteDestinations) loaded.favoriteDestinations = [];
      if (!loaded.recentItems) loaded.recentItems = [];
      state = loaded;
    }
  } catch (e) {}

  render();
  runRestockCheck();
  runNoticeCheck();
})();

// Re-check whenever the app comes back into view (switched apps, unlocked phone, etc).
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { runRestockCheck(); runNoticeCheck(); }
});

// Backup periodic check in case the app is left open continuously (every 10 minutes).
setInterval(() => { runRestockCheck(); runNoticeCheck(); }, 10 * 60 * 1000);
</script>
